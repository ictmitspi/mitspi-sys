name: Keep Supabase Awake

on:
  schedule:
    - cron: "0 1 * * 0,3"
  workflow_dispatch:

jobs:
    ping:
        runs-on: ubuntu-latest
        steps:
            - name: Read one room
              env:
                SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
                SUPABASE_KEY: ${{ secrets.SUPABASE_PUBLISHABLE_KEY }}
              run: |
                curl --fail --silent --show-error "$SUPABASE_URL/rest/v1/room?select=id&limit=1" -H "apikey: $SUPABASE_KEY"
